# Next-stage cuts after your current build.config
# Goal: initramfs + /proc + 8250 serial shell only

# Big easy wins
# CONFIG_EFI is not set
# CONFIG_EFI_STUB is not set
# CONFIG_EFI_PARTITION is not set
# CONFIG_EFIVAR_FS is not set
# CONFIG_EFI_ESRT is not set
# CONFIG_EFI_PARAMS_FROM_FDT is not set
# CONFIG_EFI_RUNTIME_WRAPPERS is not set
# CONFIG_EFI_GENERIC_STUB is not set
# CONFIG_EFI_EARLYCON is not set

# 32-bit userspace compat not needed on pure RV64 userspace
# CONFIG_COMPAT is not set

# Symbol/debug convenience, not needed for a tiny boot image
# CONFIG_KALLSYMS is not set

# Likely not needed for busybox shell initramfs
# CONFIG_FW_LOADER is not set
# CONFIG_SECCOMP is not set
# CONFIG_SECRETMEM is not set
# CONFIG_RSEQ is not set
# CONFIG_AIO is not set
# CONFIG_IO_URING is not set

# Worth testing for a pure initramfs + proc + serial setup
# CONFIG_BLOCK is not set
# CONFIG_BLK_DEV is not set
# CONFIG_MSDOS_PARTITION is not set
# CONFIG_EFI_PARTITION is not set

# Optional if your initramfs does not rely on tmpfs mounts
# CONFIG_TMPFS is not set

# Optional if no remaining DMA users require it on your platform
# CONFIG_SWIOTLB is not set

# Small cleanup
# CONFIG_PROC_CHILDREN is not set
# CONFIG_UNIX98_PTYS is not set
