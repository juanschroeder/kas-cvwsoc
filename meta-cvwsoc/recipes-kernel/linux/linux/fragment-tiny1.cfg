# Tiny boot-to-shell fragment for RV64 + initramfs + ns16550 UART + /proc
# Intended to apply on top of your normal base config.
# Keep only: MMU + ELF + initramfs + procfs + devtmpfs + 8250 serial console.

CONFIG_EXPERT=y
CONFIG_BLK_DEV_INITRD=y
CONFIG_PROC_FS=y
CONFIG_DEVTMPFS=y
CONFIG_DEVTMPFS_MOUNT=y
CONFIG_SERIAL_8250=y
CONFIG_SERIAL_8250_CONSOLE=y
CONFIG_SERIAL_8250_NR_UARTS=1
CONFIG_SERIAL_8250_RUNTIME_UARTS=1
CONFIG_SERIAL_OF_PLATFORM=y
CONFIG_TMPFS=y

# Keep only one initramfs decompressor matching the image you actually boot.
CONFIG_RD_GZIP=y
# CONFIG_RD_LZ4 is not set
CONFIG_DECOMPRESS_GZIP=y
# CONFIG_DECOMPRESS_LZ4 is not set

# Less printk traffic on a slow simulated UART.
#### CONFIG_PRINTK_TIME is not set
CONFIG_MESSAGE_LOGLEVEL_DEFAULT=4

# Not needed for a tiny boot-to-shell setup.
# CONFIG_IKCONFIG is not set
# CONFIG_IKCONFIG_PROC is not set
# CONFIG_MODULES is not set
# CONFIG_PAGE_REPORTING is not set
# CONFIG_TRANSPARENT_HUGEPAGE is not set
# CONFIG_HW_RANDOM is not set
# CONFIG_HW_RANDOM_VIRTIO is not set
# CONFIG_VIRTIO_CONSOLE is not set

# No video / VT / input stack for serial-only boot.
# CONFIG_VT is not set
# CONFIG_VT_CONSOLE is not set
# CONFIG_VGA_CONSOLE is not set
# CONFIG_VT_HW_CONSOLE_BINDING is not set
# CONFIG_FB is not set
# CONFIG_FB_SIMPLE is not set
# CONFIG_INPUT is not set
# CONFIG_HID is not set
# CONFIG_HID_GENERIC is not set
# CONFIG_USB_HID is not set
# CONFIG_INPUT_EVDEV is not set

# No board-specific peripherals beyond the UART.
# CONFIG_SERIAL_SIFIVE is not set
# CONFIG_SERIAL_SIFIVE_CONSOLE is not set
# CONFIG_SERIAL_LITEUART is not set
# CONFIG_SPI is not set
# CONFIG_SPI_SIFIVE is not set
# CONFIG_GPIOLIB is not set
# CONFIG_GPIO_SIFIVE is not set
# CONFIG_MMC is not set
# CONFIG_MMC_BLOCK is not set
# CONFIG_MMC_SPI is not set

# No storage filesystems if you boot only from initramfs.
# CONFIG_EXT2_FS is not set
# CONFIG_EXT3_FS is not set
# CONFIG_EXT4_FS is not set
# CONFIG_TMPFS_POSIX_ACL is not set

# No networking.
# CONFIG_NET is not set
# CONFIG_ETHERNET is not set
# CONFIG_NETDEVICES is not set
# CONFIG_NET_VENDOR_LITEX is not set
# CONFIG_LITEX_LITEETH is not set
# CONFIG_INET is not set
# CONFIG_PACKET is not set
# CONFIG_UNIX is not set

# No DMA engines / test drivers.
# CONFIG_DMADEVICES is not set
# CONFIG_DMA_ENGINE is not set
# CONFIG_XILINX_DMA is not set
# CONFIG_DMATEST is not set

# No USB / SCSI stack.
# CONFIG_USB_SUPPORT is not set
# CONFIG_USB is not set
# CONFIG_USB_OHCI_HCD is not set
# CONFIG_USB_OHCI_HCD_PLATFORM is not set
# CONFIG_USB_OHCI_LITTLE_ENDIAN is not set
# CONFIG_SCSI is not set
# CONFIG_BLK_DEV_SD is not set
# CONFIG_USB_STORAGE is not set
# CONFIG_USB_USBNET is not set
# CONFIG_USB_RTL8152 is not set

# Kill debug / self-test overhead.
# CONFIG_DEBUG_FS is not set
# CONFIG_DEBUG_PAGEALLOC is not set
# CONFIG_SCHED_STACK_END_CHECK is not set
# CONFIG_DEBUG_VM is not set
# CONFIG_DEBUG_MEMORY_INIT is not set
# CONFIG_SOFTLOCKUP_DETECTOR is not set
# CONFIG_WQ_WATCHDOG is not set
# CONFIG_DEBUG_RT_MUTEXES is not set
# CONFIG_DEBUG_SPINLOCK is not set
# CONFIG_DEBUG_MUTEXES is not set
# CONFIG_DEBUG_RWSEMS is not set
# CONFIG_DEBUG_ATOMIC_SLEEP is not set
# CONFIG_STACKTRACE is not set
# CONFIG_DEBUG_LIST is not set
# CONFIG_DEBUG_PLIST is not set
# CONFIG_DEBUG_SG is not set
# CONFIG_RCU_EQS_DEBUG is not set
# CONFIG_MEMTEST is not set
