#@TYPE: Machine
#@NAME: Core-V Wally SoC for Nexys A7
#@SOC: Core-V Wally SoC
#@DESCRIPTION: Machine configuration for the CVW SoC on Nexys A7

require cvwsoc64.inc

CVWSOC_BOARDNAME = "genesys2"
# Select the OpenXC7 tree for U-Boot, OpenSBI and Linux.
CVWSOC_DTS_FILENAME = "cvwsoc-wally-genesys2xc7"

# reuse genesys2 u-boot build
UBOOT_MACHINE = "openhwgroup_cvwsoc_genesys2_defconfig"
UBOOT_DTB_BINARY = "cvwsoc-${CVWSOC_BOARDNAME}.dtb"
