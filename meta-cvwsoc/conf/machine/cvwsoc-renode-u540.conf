#@TYPE: Machine
#@NAME: Renode Machine with HFive Freedom U540 SoC and CVWSoC stuff
#@SOC: HFive FU540
#@DESCRIPTION: Renode Machine with HFive Freedom U540 SoC and CVWSoC stuff (co-simulation)

require conf/machine/freedom-u540.conf
EXTRA_IMAGEDEPENDS:remove = "u-boot"

# Override sifive/fu540 not available anymore in recent OpenSBI
RISCV_SBI_PLAT = "generic"

unset RISCV_SBI_FDT
unset KERNEL_DEVICETREE

PREFERRED_PROVIDER_virtual/kernel = "linux-mainline-cvwsoc"
PREFERRED_PROVIDER_virtual/zdoom = "fbdoom"
PREFERRED_PROVIDER_virtual/bootloader = "u-boot-cvwsoc"


MACHINEOVERRIDES:append = ":cvwsoc-renode-u540"

INITRAMFS_IMAGE = "cvwsoc-image-minimal-initramfs"
INITRAMFS_IMAGE_BUNDLE = "1"

KERNEL_IMAGETYPE = "Image"
RISCV_SBI_PAYLOAD = "${KERNEL_IMAGETYPE}-initramfs-${MACHINE}.bin"

# needed?
CVWSOC_BOARDNAME ?= "nexysa7"
CVWSOC_DTS_FILENAME ?= "wally-${CVWSOC_BOARDNAME}soc"
